version: "3"

tasks:
  test:
    cmds:
      - |
          bash <<'EOF'
          set -euo pipefail
          source ../../_lib/run.sh

          go build -trimpath -ldflags="-s -w" -o bin/core-agent ../../../../cmd/core-agent

          output="$(mktemp)"
          # brain/list calls the API — exit 1 with connection error is expected offline
          run_capture_all 1 "$output" ./bin/core-agent brain/list
          assert_contains "brain" "$output"
          EOF
