version: "3"

tasks:
  test:
    cmds:
      - |
          bash <<'EOF'
          set -euo pipefail
          source ../../_lib/run.sh

          go build -trimpath -ldflags="-s -w" -o bin/core-agent ../../../../cmd/core-agent

          output="$(mktemp)"
          run_capture_all 0 "$output" ./bin/core-agent plan/templates
          assert_contains "template(s)" "$output"
          assert_contains "bug-fix" "$output"
          assert_contains "new-feature" "$output"
          EOF
