version: "3"

tasks:
  test:
    cmds:
      - |
          bash <<'EOF'
          set -euo pipefail
          source ../_lib/run.sh

          go build -trimpath -ldflags="-s -w" -o bin/core-agent ../../../cmd/core-agent

          output="$(mktemp)"
          run_capture_all 0 "$output" ./bin/core-agent check
          assert_contains "health check" "$output"
          assert_contains "binary:" "$output"
          assert_contains "agents:" "$output"
          assert_contains "workspace:" "$output"
          assert_contains "services:" "$output"
          assert_contains "actions:" "$output"
          assert_contains "commands:" "$output"
          assert_contains "env keys:" "$output"
          assert_contains "ok" "$output"
          EOF
