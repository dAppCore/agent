version: "3"

tasks:
  test:
    cmds:
      - |
          bash <<'EOF'
          set -euo pipefail
          source ../../_lib/run.sh

          go build -trimpath -ldflags="-s -w" -o bin/core-agent ../../../../cmd/core-agent

          output="$(mktemp)"
          run_capture_all 0 "$output" ./bin/core-agent dispatch/shutdown
          assert_contains "queue frozen" "$output"
          EOF
