version: 1

# Dispatch concurrency control
dispatch:
  # Default agent type when not specified
  default_agent: claude
  # Default prompt template
  default_template: coding
  # Workspace root (relative to this file's parent)
  workspace_root: .core/workspace

# Per-agent concurrency limits (0 = unlimited)
concurrency:
  claude: 1
  gemini: 3
  codex: 1

# Agent identities (which agents can dispatch)
agents:
  cladius:
    host: local
    runner: claude
    active: true
    roles: [dispatch, review, plan]
  athena:
    host: local
    runner: claude
    active: true
    roles: [worker]
  charon:
    host: 10.69.69.165
    runner: claude
    active: false
    roles: [worker, review]
  clotho:
    host: remote
    runner: claude
    active: false
    roles: [worker]
