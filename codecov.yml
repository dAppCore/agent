# Codecov gate for dappco.re/go/agent — the "start using it" ratchet.
#
# There is one config file, deliberately: Codecov accepts both codecov.yml and
# .codecov.yml, and this repo carried both with different targets (90% vs 95%),
# so which gate applied depended on Codecov's lookup order rather than on
# anything anyone had decided.
#
# project: target: auto — a PR may not drop total coverage below the base
#   commit's level, allowing a small noise threshold. Coverage climbs and never
#   regresses. This is the ratchet the file always described; the literal 95%
#   that used to sit here was above the module's actual coverage (86.7% as of
#   2026-08-01), so the project gate failed on every PR including green ones.
# patch: new / changed lines should be reasonably covered, which pulls the
#   project number upward as files are touched (the agreed strategy: tractable
#   wins now, raise the rest opportunistically as code is edited).
#
# Coverage is produced by .github/workflows/ci.yml (go test -coverprofile,
# GOWORK=off standalone build) and uploaded via codecov-action; locally use
# `task cov` (writes go/coverage.out, the path SonarCloud also reads).

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: false
    patch:
      default:
        target: 70%
        threshold: 5%
        informational: false

comment:
  layout: "reach, diff, files"
  require_changes: true

# Tests are not product code, and php/vendor/ is installed dependencies. The
# old "go/external/**" entry is gone with the tree it named — the sibling
# dappco.re modules are resolved from go.mod, never checked out in here.
ignore:
  - "**/*_test.go"
  - "**/*_example_test.go"
  - "php/tests/**"
  - "php/vendor/**"
  - "**/*Test.php"
